# Landing page — pir2pir.ru (and www, which redirects to it).
# Container listens on 127.0.0.1:8082 and sets its own cache headers.
#
# The hero's figures are not proxied here: the page reads them from api.pir2pir.ru directly, which
# needs this origin in the API's Cors:AllowedOrigins and nothing on this host. Proxying them would
# save a handshake and let nginx cache them, at the cost of a server-side step no deploy performs.

server {
    listen 80;
    listen [::]:80;
    server_name pir2pir.ru www.pir2pir.ru;
    return 301 https://pir2pir.ru$request_uri;
}

# One canonical origin: www redirects rather than serving a duplicate copy.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.pir2pir.ru;

    include snippets/pir2pir-tls.conf;

    return 301 https://pir2pir.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pir2pir.ru;

    include snippets/pir2pir-tls.conf;
    include snippets/pir2pir-headers.conf;

    access_log /var/log/nginx/pir2pir.ru.access.log;
    error_log  /var/log/nginx/pir2pir.ru.error.log;

    location / {
        proxy_pass http://127.0.0.1:8082;
        include    snippets/pir2pir-proxy.conf;

        # A bare 502 while the container is restarting reads as a fault rather than "not yet".
        proxy_intercept_errors on;
        error_page 502 503 504 = @unavailable;
    }

    location @unavailable {
        default_type text/html;
        return 503 "<!doctype html><meta charset=utf-8><title>Pir2Pir</title><body style=\"font-family:system-ui;margin:4rem auto;max-width:32rem;line-height:1.6\"><h1>Платформа временно недоступна</h1><p>Попробуйте позже.</p><p><a href=\"https://t.me/pir2pirbot\">Telegram-бот</a></p></body>";
    }
}
