# nginx site for the Pir2Pir landing page (pir2pir.ru and www).
# Install to /etc/nginx/conf.d/pir2pir.ru.conf on the host. This claims the apex from the catch-all
# in 00-default.conf, which keeps returning 404 for every other hostname.

server {
    listen 80;
    listen [::]:80;
    server_name pir2pir.ru www.pir2pir.ru;
    location / { return 301 https://pir2pir.ru$request_uri; }
}

# www -> apex, so the site has one canonical origin.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.pir2pir.ru;

    ssl_certificate     /etc/ssl/pir2pir.ru.pem;
    ssl_certificate_key /etc/ssl/pir2pir.ru.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    return 301 https://pir2pir.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pir2pir.ru;

    ssl_certificate     /etc/ssl/pir2pir.ru.pem;
    ssl_certificate_key /etc/ssl/pir2pir.ru.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/pir2pir.ru.access.log;
    error_log  /var/log/nginx/pir2pir.ru.error.log;

    location / {
        proxy_pass         http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # A bare 502 before the container exists reads as a fault rather than "not yet".
        proxy_intercept_errors on;
        error_page 502 503 504 = @unavailable;
    }

    location @unavailable {
        default_type text/html;
        return 503 "<!doctype html><meta charset=utf-8><title>Pir2Pir</title><body style=\"font-family:system-ui;margin:4rem auto;max-width:32rem;line-height:1.6\"><h1>Сервис временно недоступен</h1><p>Попробуйте позже.</p><p><a href=\"https://t.me/pir2pirbot\">Telegram-бот</a></p></body>";
    }
}
