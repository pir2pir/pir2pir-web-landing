# Landing page — pir2pir.ru (and www, which redirects to it).
# Container listens on 127.0.0.1:8082 and sets its own cache headers.

# Public metrics for the hero panel, cached here rather than fetched per visitor. The rollup behind
# them runs hourly, so a minute of staleness is invisible and the database is asked once a minute
# however much traffic the landing page gets. Kept out of the landing container's own nginx because
# that one has no route to the API.
proxy_cache_path /var/cache/nginx/landing-metrics levels=1:2 keys_zone=landing_metrics:1m
                 max_size=8m inactive=1h use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name pir2pir.ru www.pir2pir.ru;
    return 301 https://pir2pir.ru$request_uri;
}

# One canonical origin: www redirects rather than serving a duplicate copy.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.pir2pir.ru;

    include snippets/pir2pir-tls.conf;

    return 301 https://pir2pir.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pir2pir.ru;

    include snippets/pir2pir-tls.conf;
    include snippets/pir2pir-headers.conf;

    access_log /var/log/nginx/pir2pir.ru.access.log;
    error_log  /var/log/nginx/pir2pir.ru.error.log;

    # The hero's figures, served from this origin so the page never leaves it: no second TLS
    # handshake, no preflight, and the landing page stays out of the API's CORS allow-list.
    #
    # The upstream query is written here and the caller's is dropped, so this path answers with
    # exactly one thing and the cache holds exactly one entry — hence the constant key. It also
    # means the route cannot be turned into a general proxy for the API by anyone who guesses it.
    #
    # No add_header in this block on purpose: add_header does not merge across levels, so setting
    # one here would drop HSTS and nosniff from the server block for this location alone.
    location = /metrics/public {
        proxy_pass http://127.0.0.1:8080/api/metrics/public?days=90;
        include    snippets/pir2pir-proxy.conf;

        proxy_cache           landing_metrics;
        proxy_cache_key       landing-metrics;
        proxy_cache_valid     200 60s;
        proxy_cache_lock      on;
        # A panel that is a minute stale beats a panel that removes itself because the API is
        # restarting — this is a marketing figure, not a balance.
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        # nginx compresses text/html by default and nothing else, and three months of daily points
        # is mostly repeated zeroes: ~10 kB becomes under 1 kB.
        gzip       on;
        gzip_types application/json;
    }

    location / {
        proxy_pass http://127.0.0.1:8082;
        include    snippets/pir2pir-proxy.conf;

        # A bare 502 while the container is restarting reads as a fault rather than "not yet".
        proxy_intercept_errors on;
        error_page 502 503 504 = @unavailable;
    }

    location @unavailable {
        default_type text/html;
        return 503 "<!doctype html><meta charset=utf-8><title>Pir2Pir</title><body style=\"font-family:system-ui;margin:4rem auto;max-width:32rem;line-height:1.6\"><h1>Сервис временно недоступен</h1><p>Попробуйте позже.</p><p><a href=\"https://t.me/pir2pirbot\">Telegram-бот</a></p></body>";
    }
}
