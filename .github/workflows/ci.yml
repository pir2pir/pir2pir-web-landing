name: CI

on:
  push:
    branches: [develop, production]
  pull_request:
    branches: [develop, production]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      # Runs against the built bundle, so it checks what ships rather than what compiles.
      - run: npm test

      - name: Verify the prerendered site
        run: |
          set -euo pipefail

          for page in index.html en/index.html uz/index.html; do
            test -f "dist/$page" || { echo "::error::dist/$page missing"; exit 1; }
          done

          ls dist/assets/*.css        >/dev/null || { echo "::error::no stylesheet emitted";    exit 1; }
          ls dist/assets/boot-*.js    >/dev/null || { echo "::error::no boot script emitted";   exit 1; }
          ls dist/assets/metrics-*.js >/dev/null || { echo "::error::no metrics script emitted"; exit 1; }
          ls dist/assets/testimonials-*.js >/dev/null \
            || { echo "::error::no testimonials script emitted"; exit 1; }

          # The quote columns are filled by that script, so the section has to arrive with something
          # in it — a placeholder per column. Empty columns are what a visitor with no JavaScript, a
          # failed request or an empty API would be left looking at.
          for page in index.html en/index.html uz/index.html; do
            count=$(grep -o 'class="quote quote--empty"' "dist/$page" | wc -l | tr -d ' ')
            [ "$count" -ge 3 ] \
              || { echo "::error::$page ships $count placeholder quotes, expected 3"; exit 1; }
            grep -q 'data-endpoint="https://api.pir2pir.ru/api/testimonials/public"' "dist/$page" \
              || { echo "::error::$page does not name the testimonials endpoint"; exit 1; }
          done

          # The pages must arrive finished. An empty shell would still pass every check above.
          grep -q '<footer class="site-footer">' dist/index.html \
            || { echo "::error::dist/index.html is not prerendered"; exit 1; }

          # Each document has to declare, and be written in, its own language.
          grep -q '<html lang="ru">' dist/index.html    || { echo "::error::/ is not ru";    exit 1; }
          grep -q '<html lang="en">' dist/en/index.html || { echo "::error::/en/ is not en"; exit 1; }
          grep -q '<html lang="uz">' dist/uz/index.html || { echo "::error::/uz/ is not uz"; exit 1; }
          grep -q 'docs.pir2pir.ru/en/legal/' dist/en/index.html \
            || { echo "::error::/en/ links Russian legal documents"; exit 1; }
          grep -q 'docs.pir2pir.ru/uz/legal/' dist/uz/index.html \
            || { echo "::error::/uz/ links Russian legal documents"; exit 1; }

          # The legal footer is a compliance requirement, not decoration — fail if it is dropped.
          for page in index.html en/index.html uz/index.html; do
            grep -q "2-26-056967" "dist/$page" \
              || { echo "::error::operator registry number missing from $page"; exit 1; }
          done

          # What a crawler and a shared link read. None of it is visible on the page, so nothing but
          # this notices when a refactor drops it.
          for page in index.html en/index.html uz/index.html; do
            # Presence, not a particular token: the tokens change when a mirror is added or retired,
            # and whether one is *correct* is a question only Yandex can answer. What CI can catch is
            # the tag going missing entirely, which is the failure that would go unnoticed.
            grep -q 'name="yandex-verification"' "dist/$page" \
              || { echo "::error::Yandex verification missing from $page"; exit 1; }
            grep -q '<link rel="canonical"' "dist/$page" \
              || { echo "::error::no canonical in $page"; exit 1; }
            grep -q 'property="og:image" content="https://pir2pir.ru/og.png"' "dist/$page" \
              || { echo "::error::no preview image in $page"; exit 1; }
            grep -q 'application/ld+json' "dist/$page" \
              || { echo "::error::no structured data in $page"; exit 1; }
          done

          # The structured data holds itself to one rule: it describes the document it ships with and
          # never asserts anything a visitor could not read for themselves. That rule is invisible —
          # markup claiming a screenshot that was deleted, or a channel the footer stopped linking,
          # renders exactly as well as markup that is true, and only a search engine ever finds out.
          # So it is checked against the built page rather than against a list repeated here.
          python3 - <<'PY'
          import glob, html, json, os, re, sys

          LANDINGS = ['dist/index.html', 'dist/en/index.html', 'dist/uz/index.html']

          for page in sorted(glob.glob('dist/**/index.html', recursive=True)):
              doc = open(page, encoding='utf-8').read()

              # The icons are on every page, so they are checked on every page.
              icons = re.findall(r'<link rel="(?:icon|apple-touch-icon)" href="([^"]+)"', doc)
              for href in icons:
                  if not os.path.exists('dist' + href):
                      sys.exit(f'::error::{page} links an icon the site does not ship: {href}')
              # Yandex wants a raster of at least 120x120 and will not settle for the SVG, so one
              # PNG that size has to stay declared — losing it is a silent regression to a state
              # that already cost us a warning once.
              if not any(h.endswith('.png') and h != '/apple-touch-icon.png' for h in icons):
                  sys.exit(f'::error::{page} has no PNG favicon; Yandex needs one at 120x120+')

              # Everything below describes the landing to a search engine. /documentation/ is not
              # described to one — it carries noindex and ships no JSON-LD — so it stops here.
              if page not in LANDINGS:
                  continue

              raw = re.search(r'ld\+json">(.*?)</script>', doc, re.S).group(1)
              # The renderer escapes `<` so a `</script>` in the data cannot end the block early.
              nodes = {n['@type']: n for n in json.loads(raw.replace('\\u003c', '<'))['@graph']}

              # Everything the data says has to be corroborated by the markup *around* it, so the
              # data block comes out first. Searching the whole document instead would find every
              # URL inside the JSON-LD itself and confirm each claim against itself — a check that
              # can only ever pass.
              markup = html.unescape(doc.replace(raw, ''))

              for shot in nodes['WebApplication']['screenshot']:
                  file = 'dist' + shot['contentUrl'].removeprefix('https://pir2pir.ru')
                  if not os.path.exists(file):
                      sys.exit(f'::error::{page} names a screenshot the site does not ship: {file}')
                  if os.path.basename(file) not in markup:
                      sys.exit(f'::error::{page} names a screenshot it does not show: {file}')

              # sameAs is the whole set of accounts this operator speaks from, so a link the footer
              # drops has to leave the data too — a stale profile is a claim, not a leftover.
              for profile in nodes['Organization']['sameAs']:
                  if profile not in markup:
                      sys.exit(f'::error::{page} claims a profile it does not link: {profile}')

              if not nodes['WebApplication']['featureList']:
                  sys.exit(f'::error::{page} has an empty feature list')
          PY

          # The FAQ markup is the one piece of structured data with no visible counterpart to check
          # it against by eye — a question added to the data and not to the page, or the reverse,
          # renders identically. So the two lists are compared directly.
          python3 - <<'PY3'
          import html, json, re, sys
          for page in ['dist/faq/index.html', 'dist/en/faq/index.html', 'dist/uz/faq/index.html']:
              doc = open(page, encoding='utf-8').read()
              raw = re.search(r'ld\+json">(.*?)</script>', doc, re.S).group(1)
              node = json.loads(raw.replace('\\u003c', '<'))['@graph'][0]
              if node['@type'] != 'FAQPage':
                  sys.exit(f'::error::{page} is not marked up as a FAQPage')
              shown = [html.unescape(q) for q in
                       re.findall(r'<summary class="faq__question"><h2>(.*?)</h2>', doc, re.S)]
              claimed = [q['name'] for q in node['mainEntity']]
              if shown != claimed:
                  sys.exit(f'::error::{page} marks up questions it does not show: '
                           f'{set(claimed) ^ set(shown)}')
              if not all(q['acceptedAnswer']['text'].strip() for q in node['mainEntity']):
                  sys.exit(f'::error::{page} has a question with an empty answer')
              print(f'  {page}: {len(shown)} questions, markup matches')
          PY3

          test -f dist/favicon.ico || { echo "::error::favicon.ico missing"; exit 1; }
          test -f dist/og.png      || { echo "::error::og.png missing";      exit 1; }

          # One manifest per locale, each declaring its own language — a shared one would put an
          # install prompt in a language the visitor did not choose.
          for pair in "ru:dist" "en:dist/en" "uz:dist/uz"; do
            lang="${pair%%:*}"; dir="${pair#*:}"
            test -f "$dir/site.webmanifest" \
              || { echo "::error::$dir/site.webmanifest missing"; exit 1; }
            grep -q "\"lang\": \"$lang\"" "$dir/site.webmanifest" \
              || { echo "::error::$dir/site.webmanifest is not $lang"; exit 1; }
          done

          # sitemap.xml is kept by hand in public/, so it is checked against what was actually
          # built rather than against a list written here — otherwise both would have to be
          # remembered on the day a language is added. Both directions: every document has to be
          # listed, and every listing has to be a document.
          #
          # Every indexable document, that is. /documentation/ is deliberately absent, and the check
          # takes that from robots.txt rather than from a name repeated here: a page is expected in
          # the sitemap unless something disallows it, so the two files cannot drift apart. Undo the
          # Disallow and this starts demanding the sitemap entry again, which is the correct
          # question to be asked at that moment.
          disallowed() {
            grep -E '^Disallow: *[^[:space:]]' dist/robots.txt | sed 's|^Disallow: *||' |
              while read -r rule; do case "$1" in "https://pir2pir.ru$rule"*) echo yes;; esac; done
          }

          for page in $(find dist -name index.html); do
            url="https://pir2pir.ru/${page#dist/}"; url="${url%index.html}"
            if [ -n "$(disallowed "$url")" ]; then
              # Disallowed, so it must NOT be listed — a sitemap is an invitation, and inviting a
              # crawler to a URL the same site tells it to stay away from is a contradiction it
              # reports back as an error.
              if grep -q "<loc>$url</loc>" dist/sitemap.xml; then
                echo "::error::$url is disallowed in robots.txt but listed in sitemap.xml"; exit 1
              fi
              # It must also say so itself, for the crawlers that fetch it anyway.
              grep -q '<meta name="robots" content="noindex' "$page" \
                || { echo "::error::$url is disallowed but carries no noindex"; exit 1; }
              continue
            fi
            grep -q "<loc>$url</loc>" dist/sitemap.xml \
              || { echo "::error::$url is a page but is not in sitemap.xml"; exit 1; }
          done

          for url in $(grep -o '<loc>[^<]*</loc>' dist/sitemap.xml | sed -e 's|<loc>||' -e 's|</loc>||'); do
            test -f "dist/${url#https://pir2pir.ru/}index.html" \
              || { echo "::error::sitemap.xml lists $url, which is not a page"; exit 1; }
          done

          # The documents themselves are downloads, not pages — but they are behind the same
          # Disallow, and a link to one that does not ship is a 404 nobody sees until they click.
          python3 - <<'PY2'
          import html, os, re, sys
          doc = open('dist/documentation/index.html', encoding='utf-8').read()
          hrefs = re.findall(r'<a class="documents__item"\s+href="([^"]+)"', doc)
          if len(hrefs) < 1:
              sys.exit('::error::the documents page lists no files')
          for href in hrefs:
              from urllib.parse import unquote
              path = 'dist' + unquote(href)
              if not os.path.exists(path):
                  sys.exit(f'::error::the documents page links a file the site does not ship: {href}')
          print(f'  documents page: {len(hrefs)} files, all present')
          PY2

          echo "site ok"

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7
          if-no-files-found: error

  publish-image:
    name: Build & push image (GHCR)
    # On branch pushes only: build the image ONCE here (tagged by commit sha) so a later merge to
    # production deploys this exact image without rebuilding.
    if: github.event_name == 'push'
    needs: build-test

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The image serves this directory verbatim — it is not rebuilt here, so what ships is what the
      # job above verified.
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
