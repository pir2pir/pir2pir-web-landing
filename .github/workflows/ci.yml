name: CI

on:
  push:
    branches: [develop, production]
  pull_request:
    branches: [develop, production]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      # Runs against the built bundle, so it checks what ships rather than what compiles.
      - run: npm test

      - name: Verify the prerendered site
        run: |
          set -euo pipefail

          for page in index.html en/index.html uz/index.html; do
            test -f "dist/$page" || { echo "::error::dist/$page missing"; exit 1; }
          done

          ls dist/assets/*.css >/dev/null || { echo "::error::no stylesheet emitted"; exit 1; }
          ls dist/assets/*.js  >/dev/null || { echo "::error::no boot script emitted"; exit 1; }

          # The pages must arrive finished. An empty shell would still pass every check above.
          grep -q '<footer class="site-footer">' dist/index.html \
            || { echo "::error::dist/index.html is not prerendered"; exit 1; }

          # Each document has to declare, and be written in, its own language.
          grep -q '<html lang="ru">' dist/index.html    || { echo "::error::/ is not ru";    exit 1; }
          grep -q '<html lang="en">' dist/en/index.html || { echo "::error::/en/ is not en"; exit 1; }
          grep -q '<html lang="uz">' dist/uz/index.html || { echo "::error::/uz/ is not uz"; exit 1; }
          grep -q 'docs.pir2pir.ru/en/legal/' dist/en/index.html \
            || { echo "::error::/en/ links Russian legal documents"; exit 1; }
          grep -q 'docs.pir2pir.ru/uz/legal/' dist/uz/index.html \
            || { echo "::error::/uz/ links Russian legal documents"; exit 1; }

          # The legal footer is a compliance requirement, not decoration — fail if it is dropped.
          for page in index.html en/index.html uz/index.html; do
            grep -q "2-26-056967" "dist/$page" \
              || { echo "::error::operator registry number missing from $page"; exit 1; }
          done

          test -f dist/favicon.ico     || { echo "::error::favicon.ico missing";     exit 1; }
          test -f dist/site.webmanifest || { echo "::error::site.webmanifest missing"; exit 1; }

          echo "site ok"

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7
          if-no-files-found: error

  publish-image:
    name: Build & push image (GHCR)
    # On branch pushes only: build the image ONCE here (tagged by commit sha) so a later merge to
    # production deploys this exact image without rebuilding.
    if: github.event_name == 'push'
    needs: build-test

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The image serves this directory verbatim — it is not rebuilt here, so what ships is what the
      # job above verified.
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
