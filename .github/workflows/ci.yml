name: CI

on:
  push:
    branches: [develop, production]
  pull_request:
    branches: [develop, production]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - name: Verify the bundle
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          ls dist/assets/*.js  >/dev/null || { echo "::error::no js bundle emitted"; exit 1; }
          ls dist/assets/*.css >/dev/null || { echo "::error::no css bundle emitted"; exit 1; }
          # The legal footer is a compliance requirement, not decoration — fail if it is dropped.
          grep -q "2-26-056967" dist/assets/*.js \
            || { echo "::error::operator registry number missing from the bundle"; exit 1; }
          echo "bundle ok"

  publish-image:
    name: Build & push image (GHCR)
    # On branch pushes only: build the image ONCE here (tagged by commit sha) so a later merge to
    # production deploys this exact image without rebuilding.
    if: github.event_name == 'push'
    needs: build-test

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
