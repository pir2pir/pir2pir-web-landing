# Serves the prerendered landing page. TLS and the public hostname are handled by the host nginx.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # This server sits behind the host nginx, so it must never name itself in a Location header —
    # an absolute redirect here would send visitors to 127.0.0.1:8080.
    absolute_redirect off;

    # Russian is served from the root, so /ru/ is not a document. Redirect rather than duplicate it:
    # two URLs with the same content is the one thing hreflang cannot repair.
    location ~ ^/ru(?:/.*)?$ {
        return 301 /$is_args$args;
    }

    # Fingerprinted filenames, so they can never go stale under the same name. Declared before the
    # extension rule below, because a regex location wins over a prefix one whatever the order.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # .webmanifest is not in nginx's mime.types, so it would go out as application/octet-stream and
    # be ignored. default_type rather than a types block: a types block at this level would replace
    # the inherited map instead of extending it.
    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 7d;
    }

    # Icons, marks and the city crests: not fingerprinted and rarely edited, so a short life rather
    # than an immutable one. Every raster format the crests use belongs here — a lone .jpg falling
    # through to the document rule below would revalidate on every request.
    location ~* \.(?:ico|png|svg|jpe?g|webp|avif)$ {
        expires 7d;
        try_files $uri =404;
    }

    # Every language is a real document: / -> index.html, /en/ -> en/index.html, /uz/ -> uz/index.html.
    # Anything else is a genuine 404 — there is no client-side router left to hand it to.
    #
    # These must revalidate, or a deploy would not reach browsers holding a cached copy.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml application/manifest+json image/svg+xml;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
