# Serves the built landing page. TLS and the public hostname are handled by the host nginx.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single page: unknown paths fall back to the shell rather than 404, so client routing works
    # if it is ever added. Real missing assets still 404 via the /assets/ block below.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints these filenames, so they can never go stale under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The shell must revalidate, or a deploy would not reach browsers holding a cached copy.
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml image/svg+xml;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
